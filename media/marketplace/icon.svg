<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Machine Manager</title>
  <desc id="desc">Minimal cool-blue icon with two offset virtual machine windows and a terminal prompt.</desc>

  <!-- Solid app badge gives reliable contrast on light and dark VS Code themes. -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#101B2E"/>

  <!-- VM behind the selected machine. -->
  <rect x="98" y="104" width="257" height="244" rx="38"
        fill="#172C46" stroke="#6A9FC9" stroke-width="18"/>

  <!-- Selected VM/console. -->
  <rect x="152" y="164" width="263" height="244" rx="38"
        fill="#2563EB" stroke="#66D9E8" stroke-width="14"/>

  <!-- Minimal terminal cue, no fonts required. -->
  <path d="M221 253 L266 286 L221 319"
        fill="none" stroke="#FFFFFF" stroke-width="23"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M292 322 H343"
        fill="none" stroke="#FFFFFF" stroke-width="23" stroke-linecap="round"/>
</svg>
