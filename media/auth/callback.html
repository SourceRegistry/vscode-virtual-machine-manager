<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="{{favicon}}">
<title>{{title}} · VM Manager</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f6f8;
    --surface: #fff;
    --ink: #182333;
    --muted: #647083;
    --border: #e4e8ee;
    --accent: #df6800;
    --icon-bg: #fff3e8;
    --button: #182333;
    --button-text: #fff;
    --shadow: 0 16px 60px #1823330a;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 30px 40px;
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .app-mark {
    width: 29px;
    height: 29px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--surface);
    display: grid;
    place-items: center;
  }
  .app-mark svg {
    width: 19px;
    height: 19px;
  }
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 32px 24px 100px;
  }
  .card {
    width: 100%;
    max-width: 488px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 42px 40px 0;
    overflow: hidden;
  }
  .provider {
    display: flex;
    gap: 9px;
    align-items: center;
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
  }
  .provider img {
    width: 23px;
    height: 23px;
    fill: var(--ink);
  }
  .status {
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    margin: 36px 0 23px;
    background: var(--icon-bg);
    color: var(--accent);
    border: 1px solid color-mix(in srgb,var(--accent) 14%,transparent);
    border-radius: 50%;
  }
  .status svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -1px;
    line-height: 1.2;
    margin: 0 0 15px;
    text-wrap: balance;
  }
  p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
    max-width: 360px;
  }
  .action {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    min-height: 46px;
    padding: 12px 19px;
    background: var(--button);
    color: var(--button-text);
    border-radius: 9px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    margin-top: 28px;
    transition: opacity .15s;
  }
  .action:hover {
    opacity: .85;
  }
  .action:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
  .action svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .note {
    font-size: 12px;
    margin: 16px 0 34px;
    line-height: 1.6;
  }
  .card-footer {
    margin: 0 -40px;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .card-footer svg {
    width: 14px;
    height: 14px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  footer {
    text-align: center;
    padding: 0 24px 24px;
    color: var(--muted);
    font-size: 12px;
  }
  @media(prefers-color-scheme:dark) {
    :root {
      --page: #10151d;
      --surface: #181f29;
      --ink: #eef2f7;
      --muted: #a3afc0;
      --border: #2c3542;
      --accent: #f89a46;
      --icon-bg: #36291e;
      --button: #edf2f7;
      --button-text: #182333;
      --shadow: 0 16px 60px #0002;
    }
  }
  @media(max-width:520px) {
    header {
      padding: 24px;
    }
    main {
      padding: 20px 20px 56px;
    }
    .card {
      padding: 30px 26px 0;
      border-radius: 16px;
    }
    h1 {
      font-size: 27px;
    }
    .card-footer {
      margin: 0 -26px;
      padding: 17px 26px;
    }
    .status {
      margin-top: 30px;
    }
    .action {
      width: 100%;
    }
  }
  @media(prefers-reduced-motion:reduce) {
    .action {
      transition: none;
    }
  }
</style>
</head>
<body data-auto-close="{{autoClose}}">
<header><span class="app-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5m9 0h5"/></svg></span>VM Manager</header>
<main>
<section class="card" aria-labelledby="title">
<div class="provider"><img src="{{providerIcon}}" alt="" width="23" height="23"><span>{{providerName}} <span aria-hidden="true">·</span> OpenID Connect</span></div>
<div class="status" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="{{statusPath}}"/></svg></div>
<h1 id="title">{{title}}</h1>
<p>{{description}}</p>
<a class="action" href="{{editorUrl}}">Open VS Code<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
<p class="note">{{note}}</p>
<div class="card-footer"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Authentication is handled by your identity provider.</div>
</section>
</main>
<footer>VM Manager for Visual Studio Code</footer>
<script nonce="{{nonce}}">
(() => {
  // Avoid leaving the authorization code in the browser address bar or history entry.
  history.replaceState(null, '', '/');
  if (document.body.dataset.autoClose !== 'true') return;
  let timer;
  const closeTab = () => { clearTimeout(timer); window.close(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) closeTab(); });
  const checkServer = async () => {
    try {
      const response = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(2000) });
      if (!response.ok) { closeTab(); return; }
      timer = setTimeout(checkServer, 2500);
    } catch { closeTab(); }
  };
  timer = setTimeout(checkServer, 2500);
})();
</script>
</body>
</html>
