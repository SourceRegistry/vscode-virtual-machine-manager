<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="var(--vscode-font-family, sans-serif)" font-size="14">
  <!--
    The walkthrough webview's CSP blocks <style> elements and style="" attributes,
    so theme colours are applied via presentation attributes only.
  -->
  <g fill="var(--vscode-editorWidget-background, #252526)" stroke="var(--vscode-widget-border, var(--vscode-contrastBorder, #8888))" stroke-width="1">
    <rect x="20" y="20" width="230" height="56" rx="6"/>
    <rect x="90" y="96" width="230" height="56" rx="6"/>
    <rect x="160" y="174" width="250" height="44" rx="6"/>
    <rect x="160" y="234" width="250" height="44" rx="6"/>
  </g>

  <g fill="none" stroke="var(--vscode-descriptionForeground, #9d9d9d)" stroke-width="1.5">
    <path d="M60 76 V124 H90"/>
    <path d="M130 152 V196 H160"/>
    <path d="M130 196 V256 H160"/>
  </g>

  <g fill="var(--vscode-foreground, #cccccc)" font-weight="600">
    <text x="36" y="44">Cluster</text>
    <text x="106" y="120">Node</text>
    <text x="194" y="201">web-01</text>
    <text x="194" y="261">db-01</text>
  </g>

  <g fill="var(--vscode-descriptionForeground, #9d9d9d)" font-size="12">
    <text x="36" y="64">Local (Hyper-V) · Proxmox lab</text>
    <text x="106" y="140">DESKTOP-ALEX · pve-01</text>
    <text x="300" y="201">Running</text>
    <text x="300" y="261">Off</text>
  </g>

  <circle cx="180" cy="196" r="5" fill="var(--vscode-testing-iconPassed, #3fb950)"/>
  <circle cx="180" cy="256" r="5" fill="var(--vscode-disabledForeground, #888888)"/>
</svg>
