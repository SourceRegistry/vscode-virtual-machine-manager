name: CI

# Pull requests only: a push trigger as well ran every PR commit twice. main is tested by release.yml
# before it releases; a branch without a PR can be run by hand (workflow_dispatch).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A new commit on a PR cancels the run of the previous one. Other events get their own group (run_id),
# so a release's test run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # The VS Code the integration test runs, kept between runs: a flaky update server then costs
      # nothing (test-electron falls back to a cached build when it cannot look up the latest).
      - name: VS Code for the integration test (week)
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Integration test (VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration test (VS Code)
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Package
        if: runner.os == 'Linux'
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: out/*.vsix
          if-no-files-found: error

  # Drives the QEMU provider against a real QEMU (TCG, an empty UEFI VM; no guest OS is needed).
  # The guest-agent test (guest.e2e.test.ts) needs a cloud image, so it stays a local check.
  qemu-e2e:
    name: QEMU end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-utils ovmf qemu-efi-aarch64

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - run: npm ci

      - name: End-to-end tests against real QEMU
        run: npx vitest run extensions/qemu/test/e2e.test.ts
        env:
          VMM_E2E_QEMU: '1'
