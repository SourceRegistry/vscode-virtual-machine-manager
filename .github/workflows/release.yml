# Releases on every push to main. Every extension (the core and each provider) is released on its own:
# semantic-release derives its next version from the Conventional Commits that touched it since its
# last tag, updates its CHANGELOG.md and version, publishes it to the VS Code Marketplace and creates
# a GitHub release with its VSIX. Extensions without releasable commits are left alone.
#
# Marketplace Trusted Publishing policy (publisher → Trusted Publishing):
#   Repository owner: SourceRegistry
#   Repository:       vscode-virtual-machine-manager
#   Workflow:         release.yml
#   Environment:      marketplace
#
# main is protected by a ruleset (pull request + passing "Test" checks, no direct pushes). The release
# commit that semantic-release pushes needs a bypass, which the built-in GITHUB_TOKEN cannot get, so
# the release job uses the RELEASE_TOKEN secret: a fine-grained personal access token of a repository
# admin (this repository, Contents: read and write).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Re-publish an existing release tag (e.g. v1.2.0 or vm-manager-qemu-v1.2.0) to the Marketplace. Leave empty to run a normal release.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # release commit, tag and GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # Marketplace trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Release
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  republish:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write # Marketplace trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The tag names the extension (core: v1.2.0, provider: vm-manager-qemu-v1.2.0).
      - name: Package
        run: node scripts/package.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Publish to the Marketplace
        run: node scripts/publish.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
